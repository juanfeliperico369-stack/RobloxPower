:root{--ink:#0b0b0f;--pap:#f2e8d5;--pap2:#e3d3b0;--red:#e0262f;--red2:#8a1219;--mus:#f0b429;--mus2:#a8740c;--tea:#0f5c66;--tea2:#08343b;
--neo:#39c8ff;--pur:#a42cff;--mag:#ff2fb3;--grn:#2dffb3;--wht:#fff;--dim:#9b917c;
--fd:"Titulos","Arial Narrow",Impact,sans-serif;--fb:"Cuerpo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:Georgia,"Times New Roman",serif;--fm:ui-monospace,"Roboto Mono",Consolas,monospace;
--sh:4px 4px 0 var(--ink);--dots:radial-gradient(circle,rgba(0,0,0,.22) 1.1px,transparent 1.6px) 0 0/7px 7px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--pap);font-family:var(--fb);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mus);outline-offset:2px}
input{font:inherit}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#000}
#tone{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%),var(--dots);-webkit-mask:radial-gradient(ellipse at center,transparent 60%,#000 100%);mask:radial-gradient(ellipse at center,transparent 60%,#000 100%);opacity:.75}
.low #tone{display:none}
/* ---------- tipografía ---------- */
.mega{font-family:var(--fd);text-transform:uppercase;line-height:.86;margin:0;letter-spacing:-.005em}
.kick{font-family:var(--fs);font-style:italic;color:var(--mus);font-size:16px}
.spaced{font-weight:800;letter-spacing:.38em;text-transform:uppercase;font-size:11px}
.outl{color:transparent;-webkit-text-stroke:2px var(--mus)}
.pag{font-weight:800;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.m{color:var(--dim);font-size:13px}.w{color:var(--wht)}.ok{color:var(--grn)}.bad{color:var(--red)}.gold{color:var(--mus)}.pur{color:var(--pur)}
/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);padding:9px 16px;font-family:var(--fd);font-size:20px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);background:var(--mus);box-shadow:var(--sh);min-height:46px}
.btn.red{background:var(--red);color:var(--wht)}.btn.tea{background:var(--tea);color:var(--wht)}.btn.pap{background:var(--pap)}.btn.blk{background:var(--ink);color:var(--pap);border-color:var(--pap)}
.btn.sm{font-size:15px;padding:5px 10px;min-height:36px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.38;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + var(--sat)) calc(8px + var(--sar)) 0 calc(8px + var(--sal));display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:10}
.htop{display:flex;align-items:flex-start;gap:6px}
.zbox{background:var(--ink);border:3px solid var(--mus);padding:3px 8px 4px;box-shadow:var(--sh);min-width:0;max-width:46vw}
.zbox .mega{font-size:19px;color:var(--wht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zbox .spaced{font-size:8.5px;color:var(--mus);letter-spacing:.3em;white-space:nowrap}
.chips{flex:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;min-width:0}
.chip{background:var(--pap);color:var(--ink);border:2px solid var(--ink);padding:1px 6px;font-family:var(--fd);font-size:16px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.chip i{font-style:normal;font-size:12px;margin-right:2px}
.chip.pw{background:var(--red);color:var(--wht)}
#bMenu,#bChat{pointer-events:auto;width:42px;height:38px;background:var(--ink);border:3px solid var(--pap);font-size:19px;color:var(--pap);box-shadow:var(--sh);flex:none}
.bars{display:grid;gap:3px;width:min(46vw,210px)}
.bar{height:11px;border:2px solid var(--ink);background:#2a2530;position:relative;box-shadow:2px 2px 0 var(--ink)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .12s}
.bar.au i{background:var(--pur)}.bar.en i{background:var(--mus)}
.bar span{position:absolute;left:4px;top:-3px;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--wht);text-shadow:0 0 3px #000}
#quest{pointer-events:auto;align-self:flex-start;max-width:min(62vw,300px);background:var(--pap);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--sh);padding:4px 8px 5px;text-align:left;position:relative}
#quest .spaced{font-size:8.5px;color:var(--red2);letter-spacing:.28em}
#quest .qt{font-family:var(--fd);font-size:16px;line-height:1;text-transform:uppercase}
#quest .qh{font-size:12px;line-height:1.25;margin-top:2px}
#quest .qp{height:5px;background:#cdbf9f;margin-top:4px}#quest .qp i{display:block;height:100%;background:var(--red)}
#mini{position:absolute;right:calc(8px + var(--sar));top:calc(86px + var(--sat));width:96px;height:76px;border:3px solid var(--pap);box-shadow:var(--sh);background:var(--ink);pointer-events:auto;image-rendering:pixelated}
#mini.big{width:min(70vw,330px);height:min(55vw,260px)}
#coach{position:fixed;left:50%;top:calc(172px + var(--sat));transform:translateX(-50%);z-index:12;width:min(88vw,420px);background:var(--pap) var(--dots);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--mus);padding:7px 10px 8px;font-size:13.5px;line-height:1.35;pointer-events:auto;animation:tin .3s ease-out}
#coach b{font-family:var(--fd);font-size:15px;color:var(--red2);display:block;letter-spacing:.04em}
#banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center}
#banner .mega{font-size:clamp(40px,12vw,92px);color:var(--mus);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);animation:bnr 1.8s ease-out forwards}
#banner .kick{display:block;color:var(--wht);text-shadow:0 0 6px #000,2px 2px 0 #000;animation:bnr 1.8s ease-out forwards}
@keyframes bnr{0%{transform:scale(.4) rotate(-6deg);opacity:0}15%{transform:scale(1.12) rotate(-3deg);opacity:1}25%{transform:scale(1) rotate(-3deg)}85%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-3deg) translateY(-20px)}}
.tour #quest{display:none}
#tbar{position:fixed;left:calc(8px + var(--sal));top:calc(104px + var(--sat));max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis;z-index:11;background:var(--ink);border:3px solid var(--pur);padding:3px 10px;font-family:var(--fd);font-size:18px;color:var(--wht);box-shadow:0 0 14px rgba(164,44,255,.6);white-space:nowrap;text-transform:uppercase}
#tbar b{color:var(--mus)}
/* ---------- controles táctiles ---------- */
#ctl{position:fixed;inset:0;z-index:9;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(242,232,213,.55);background:rgba(11,11,15,.25);display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--pap);border:3px solid var(--ink);box-shadow:var(--sh)}
#joyHint{position:absolute;left:calc(22px + var(--sal));bottom:calc(30px + var(--sab));width:96px;height:96px;border-radius:50%;border:3px dashed rgba(242,232,213,.35);display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;color:rgba(242,232,213,.5);font-weight:800}
.abtns{position:absolute;right:calc(14px + var(--sar));bottom:calc(16px + var(--sab));width:190px;height:190px;pointer-events:none}
.ab{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--ink);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);text-transform:uppercase;color:var(--ink);overflow:hidden}
.ab small{font-size:10px;line-height:1;margin-top:1px}
#bAtk{right:0;bottom:0;width:88px;height:88px;background:var(--red);color:var(--wht);font-size:30px}
